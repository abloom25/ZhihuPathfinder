server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Avoid logging queries or personal route identifiers.
    access_log off;
    client_max_body_size 16k;
    location = /healthz {
        proxy_pass http://api:8787;
    }
    location ^~ /api/ {
        proxy_pass http://api:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_set_header Host $http_host;
    }
    location ~ /\. { return 404; }
    location ~* \.(js|css|map|json|png|jpg|jpeg|gif|svg|webp|ico|woff2?|txt)$ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =503;
    }
    location / {
        if (!-f $document_root/index.html) { return 503; }
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
