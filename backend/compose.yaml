name: zhihu-later
services:
  api:
    image: later-api:${RELEASE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SHARE_FILE: /app/share-data/shares.json
    volumes:
      - shares:/app/share-data
    expose: ["8787"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST:-./frontend-dist}:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  shares:
